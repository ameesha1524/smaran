spring:
  application:
    name: smaran

  # PostgreSQL in every environment that holds a real person's data.
  datasource:
    url: ${SMARAN_DB_URL:jdbc:postgresql://localhost:5432/smaran}
    username: ${SMARAN_DB_USER:smaran}
    password: ${SMARAN_DB_PASSWORD:smaran}

  jpa:
    hibernate:
      # Flyway owns the schema (db/migration). Hibernate only checks that the
      # entities match it, in every profile, and refuses to start if not.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SMARAN_REDIS_HOST:localhost}
      port: ${SMARAN_REDIS_PORT:6379}
      # Redis caches session state and real-time garden events. Its absence
      # degrades latency, never correctness — nothing is stored only there.

  servlet:
    multipart:
      # A photograph and five seconds of audio. Nothing here needs more.
      max-file-size: 12MB
      max-request-size: 24MB

server:
  port: ${SMARAN_PORT:8080}
  compression:
    enabled: true

smaran:
  security:
    # MUST be overridden in every deployment. Outside the dev, demo and test
    # profiles the application refuses to start unless this is a real secret of
    # at least 32 bytes.
    jwt-secret: ${SMARAN_JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    access-ttl-minutes: 15
    # The refresh cookie is Secure by default. Browsers accept it on localhost;
    # dev and demo turn it off so plain http on a LAN address also works.
    cookie-secure: true
    refresh-ttl-days: 7
    open-demo: false

  auth:
    # Five wrong passwords lock an account for 15 minutes. Every failure
    # looks the same to the caller, locked or not.
    max-failures: 5
    lockout-minutes: 15
    # Sign-in attempts per client address before that address is refused.
    ip-max-failures: 20
    ip-window-minutes: 15
    register-max-per-hour: 10

  bootstrap:
    # The first administrator, created once on first start if no admin exists.
    # Never from source: set both in the environment. Without them no admin is
    # created and the start-up log says so.
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

  pairing:
    # A code is minted on the family's phone and may be typed into the tablet
    # later that day or the next: 72 hours, one use.
    code-ttl-hours: 72
    # A tablet's token slides forward every time it is seen, so an abandoned
    # tablet lapses after this long but a used one never does. A locked-out
    # patient cannot recover an account; the family removes a tablet instead.
    device-ttl-days: 180
    # Failed tries allowed per tablet fingerprint and per client address per window.
    max-failures: 5
    failure-window-minutes: 15
    # Mixed into the stored hash of every code. Defaults to the signing secret,
    # which production already must set; set this to keep the two apart.
    # pepper:

  journal:
    # The model that reads a journal entry for how it feels, called from the server. With no
    # key nothing is read, and the entry simply saves on her tablet.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${SMARAN_JOURNAL_MODEL:claude-haiku-4-5-20251001}

  scoring:
    # Which rule turns low readings into an alert: TWO_CONSECUTIVE (default),
    # SINGLE or CUSUM. Status on the dashboard is unaffected; see
    # org.smaran.scoring.ScoringEngine#alertFor.
    alert-rule: ${SMARAN_ALERT_RULE:TWO_CONSECUTIVE}
    # CUSUM only. k is the slack in SD units; h is the threshold (decline at
    # h, watch at h / 2).
    cusum-k: 0.5
    cusum-h: 4

  cors:
    allowed-origins: ${SMARAN_CORS:http://localhost:5173}

  storage:
    # Swap for an S3 client in a deployment; the key format does not change.
    dir: ${SMARAN_STORAGE:./storage}

  garden:
    # 02:05 nightly: put yesterday's quiet gardens to sleep, and tell a caregiver
    # only after three consecutive days.
    rest-sweep-cron: "0 5 2 * * *"

  reminders:
    cron: "0 * * * * *"

  notifications:
    fcm-key: ${SMARAN_FCM_KEY:}
    twilio-sid: ${SMARAN_TWILIO_SID:}
    twilio-token: ${SMARAN_TWILIO_TOKEN:}

logging:
  level:
    org.smaran: INFO
    # Never log request bodies: they carry mood, voice features and family names.
    org.springframework.web: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Nothing is stored only in Redis and no code reads it, so its absence must
    # not mark the application unhealthy.
    redis:
      enabled: false

---
# ---------------------------------------------------------------------------
# dev — local development against the Postgres in docker-compose.yml
# (`docker compose up -d db`), or with no Docker at all through
# LocalDevApplication. Demo data is seeded and the API is open, so the PWA
# runs without accounts. Never point this profile at a real person's data.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

smaran:
  security:
    jwt-secret: dev-only-secret-dev-only-secret-dev-only-32
    open-demo: true
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173

logging:
  level:
    org.smaran: DEBUG

---
# ---------------------------------------------------------------------------
# demo — the same seeded, synthetic data as dev, with authentication ON. This
# is the profile to show the app with: the demo accounts work here and in dev,
# and nowhere else.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: demo

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

smaran:
  security:
    jwt-secret: ${SMARAN_JWT_SECRET:demo-only-secret-demo-only-secret-demo-32}
    open-demo: false
    cookie-secure: false
  cors:
    allowed-origins: ${SMARAN_CORS:http://localhost:5173,http://localhost:4173,http://localhost:8081}

---
# ---------------------------------------------------------------------------
# test — integration tests. The datasource is supplied by the test itself
# (a throwaway PostgreSQL), nothing is seeded, and authentication is ON.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

smaran:
  security:
    jwt-secret: test-only-secret-test-only-secret-test-32
    open-demo: false

---
# ---------------------------------------------------------------------------
# prod — everything comes from the environment. StartupChecks refuses to boot
# without a real JWT secret of at least 32 bytes, or with the API open.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

smaran:
  security:
    jwt-secret: ${SMARAN_JWT_SECRET:}
    open-demo: false
