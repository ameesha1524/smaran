# Included by every location in default.conf. nginx drops inherited add_header lines in a
# location that sets its own, so they are repeated by include rather than set once at the top.
#
# Strict-Transport-Security is not set here: this container speaks plain http to Caddy, which
# terminates TLS and adds it.
#
# The CSP allows exactly what the app loads from elsewhere: Google Fonts (CSS and font files),
# the MediaPipe face-landmark script (jsDelivr) and its model (Google storage), and WebAssembly
# for it. The tablet's camera never leaves the device; the script and model only come to it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# The pond uses the microphone (her voice, as five numbers) and the camera (face geometry, never a
# frame sent anywhere). Nothing else is needed.
add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=(), usb=()" always;
