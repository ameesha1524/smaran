# Smaran — the whole system on one machine.
#
#   docker compose up --build
#   → PWA            http://localhost:8081
#   → API            http://localhost:8080
#
# PostgreSQL, Redis, the Spring Boot backend, and the PWA behind nginx.
#
# For day-to-day development start only the database and run the backend and
# the frontend from source:
#
#   docker compose up -d db
#   cd backend && mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# The backend container starts in the `demo` profile by default: synthetic
# seeded data, authentication on. Set SMARAN_PROFILE=prod for an empty,
# production-shaped start, which also requires a real SMARAN_JWT_SECRET.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smaran
      POSTGRES_USER: smaran
      # Change this before anything real. The backend refuses to start with a
      # placeholder JWT secret; the database will not stop you.
      POSTGRES_PASSWORD: ${SMARAN_DB_PASSWORD:-smaran}
    ports:
      # Published on localhost only, for a backend run from source. Set
      # SMARAN_DB_PORT if 5432 is taken (a local PostgreSQL service, say).
      - "127.0.0.1:${SMARAN_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smaran -d smaran"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SMARAN_PROFILE:-demo}
      SMARAN_DB_URL: jdbc:postgresql://db:5432/smaran
      SMARAN_DB_USER: smaran
      SMARAN_DB_PASSWORD: ${SMARAN_DB_PASSWORD:-smaran}
      SMARAN_REDIS_HOST: redis
      # 32 bytes minimum. Generate with: openssl rand -base64 48
      # The fallback is the built-in demo value, which the backend accepts in
      # the demo profile and refuses to start with in prod.
      SMARAN_JWT_SECRET: ${SMARAN_JWT_SECRET:-demo-only-secret-demo-only-secret-demo-32}
      SMARAN_CORS: http://localhost:8081
      SMARAN_STORAGE: /app/storage
      # Notifications degrade to log lines until these are filled in.
      SMARAN_FCM_KEY: ${SMARAN_FCM_KEY:-}
      SMARAN_TWILIO_SID: ${SMARAN_TWILIO_SID:-}
      # Journal entries are read for how they feel by a model the server calls. No key: not read.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMARAN_TWILIO_TOKEN: ${SMARAN_TWILIO_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      # Family photographs and voice notes. Back this up — it is irreplaceable
      # in a way the database is not.
      - media:/app/storage

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:
  redis-data:
  media:
