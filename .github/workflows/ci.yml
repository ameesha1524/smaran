# Continuous integration: every push and pull request.
#
#   frontend     typecheck (the strict compiler is this project's lint), tests, the golden file, build
#   backend      unit and integration tests on PostgreSQL 16, then the data-science code on the export
#   datascience  pytest, the committed test cohort, a small-N run of the simulation
#   docker-build both images, scanned (Trivy), then a REHEARSAL of the deploy: a good release, a release that
#                never starts and a release whose API is broken, each of which must be rolled back
#   security     secrets (gitleaks), dependency audits (npm, pip) and a Trivy scan of the repository
#   e2e          the compose stack, a real browser (Playwright), and the smoke test
#
# security.yml adds CodeQL and a weekly re-run of the audits; cd.yml deploys what passes here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b && npx tsc -p tsconfig.test.json
      - name: Unit tests, including the golden vectors
        run: npm test
      - name: golden-vectors.json is what the engine generates
        run: |
          npm run golden
          git diff --exit-code -- ../golden-vectors.json
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests, the golden vectors against the Java engine, the authorization matrix, the pairing
      # tests, and the integration tests on a PostgreSQL 16 container (Testcontainers).
      - run: mvn -B verify
        env:
          SMARAN_TEST_DB: docker
      # CohortExportIT loaded the synthetic cohort through ingestion and wrote what
      # the admin export returned; the Python evaluation must run on that file and
      # reproduce the cohort exactly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: data-science/requirements.txt
      - name: The data-science code runs on what the API exported
        working-directory: ${{ github.workspace }}
        run: |
          pip install -r data-science/requirements.txt
          cd data-science
          PYTHONPATH=src python src/run_on_export.py \
            --csv ../backend/target/export-sessions.csv \
            --hash-map ../backend/target/export-hash-map.json \
            --cohort ../backend/src/test/resources/cohort
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  datascience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-science
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: data-science/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests, including the golden vectors and the sundowning vectors
        run: python -m pytest -q
      - name: The committed test cohort is what the simulator writes
        run: |
          PYTHONPATH=src python src/simulate.py --fixture --out /tmp/fixture
          diff -r /tmp/fixture ../backend/src/test/resources/cohort
      - name: A small-N run of the simulation and every analysis
        env:
          SMARAN_DS_SMALL: "1"
          SMARAN_DS_BOOT: "100"
          SMARAN_DS_RESULTS: out/small-results
        run: PYTHONPATH=src python src/run_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-science-small-results
          path: data-science/out/small-results

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ghcr.io/local/smaran-backend:good
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ghcr.io/local/smaran-frontend:good
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      # High and critical findings with a fix available fail the build. Findings with no fix yet are
      # listed in the log (the table below) and are decisions, not build failures.
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/local/smaran-backend:good
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/local/smaran-frontend:good
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      # A good release goes out; one that never starts and one whose API is broken (health is fine,
      # the smoke test is not) are each put back. Also the nightly backup and the restore.
      - name: Rehearse the deploy, the rollback, the backup and the restore
        run: deploy/rehearse.sh
      - name: Logs, if the rehearsal failed
        if: failure()
        run: |
          cd "${RUNNER_TEMP}/smaran-rehearsal" 2>/dev/null && docker compose -f docker-compose.prod.yml --env-file .env logs --tail 120 || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What ships in the browser. Development tooling is reported by the weekly run in security.yml and
      # handled by Dependabot; a finding in the build tools is not a finding in the product.
      - name: npm audit (the packages that ship)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit (data-science)
        run: |
          pip install pip-audit
          pip-audit -r data-science/requirements.txt
      - name: Trivy on the repository (Maven, npm and pip lock files, and secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: frontend/node_modules,e2e/playwright/node_modules

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Bring the stack up (the database, the backend in the demo profile, the PWA behind nginx)
        run: docker compose up --build -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/playwright/package-lock.json
      - name: Install the browser
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The smoke test, as the deploy runs it
        env:
          BASE_URL: http://localhost:8081
          SMOKE_PASSWORD: ci-smoke-password-not-a-secret
        run: deploy/smoke.sh
      - name: The browser tests
        working-directory: e2e/playwright
        env:
          BASE_URL: http://localhost:8081
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright/playwright-report
            e2e/playwright/test-results
      - name: Logs, if it failed
        if: failure()
        run: docker compose logs --tail 150
