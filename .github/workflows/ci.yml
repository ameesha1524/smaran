# Continuous integration: every push and pull request.
#
# A deliberately small version. Phase 6 adds Docker builds, security scans and
# the end-to-end suite. The data-science job and the export check are here
# because Phase 5 needs them.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b && npx tsc -p tsconfig.test.json
      - name: Unit tests, including the golden vectors
        run: npm test
      - name: golden-vectors.json is what the engine generates
        run: |
          npm run golden
          git diff --exit-code -- ../golden-vectors.json
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests, the golden vectors against the Java engine, and the
      # integration tests on a PostgreSQL 16 container (Testcontainers).
      - run: mvn -B verify
        env:
          SMARAN_TEST_DB: docker
      # CohortExportIT loaded the synthetic cohort through ingestion and wrote what
      # the admin export returned; the Python evaluation must run on that file and
      # reproduce the cohort exactly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: data-science/requirements.txt
      - name: The data-science code runs on what the API exported
        working-directory: ${{ github.workspace }}
        run: |
          pip install -r data-science/requirements.txt
          cd data-science
          PYTHONPATH=src python src/run_on_export.py             --csv ../backend/target/export-sessions.csv             --hash-map ../backend/target/export-hash-map.json             --cohort ../backend/src/test/resources/cohort
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  datascience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-science
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: data-science/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests, including the golden vectors and the sundowning vectors
        run: python -m pytest -q
      - name: The committed test cohort is what the simulator writes
        run: |
          PYTHONPATH=src python src/simulate.py --fixture --out /tmp/fixture
          diff -r /tmp/fixture ../backend/src/test/resources/cohort
      - name: A small-N run of the simulation and every analysis
        env:
          SMARAN_DS_SMALL: "1"
          SMARAN_DS_BOOT: "100"
          SMARAN_DS_RESULTS: out/small-results
        run: PYTHONPATH=src python src/run_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-science-small-results
          path: data-science/out/small-results
